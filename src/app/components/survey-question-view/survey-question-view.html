<div class="question-block">
  <p class="question-label">{{ index() }}. {{ question().text }}</p>
  @if (question().allowMultiple) {
    <p class="question-hint">More than one answers are possible.</p>
  }

  @for (answer of question().answers; track answer.id) {
    <label class="answer-row">
      <input type="checkbox" class="answer-checkbox" disabled />
      <span class="answer-letter">{{ getAnswerLabel($index) }}.</span>
      <span class="answer-text">{{ answer.text }}</span>
    </label>
  }
</div>
