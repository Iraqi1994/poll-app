<section class="active-surveys">
  <div class="active-surveys__toolbar">
    <div class="active-surveys__tabs" role="group" aria-label="Filter surveys by status">
      <button
        type="button"
        class="active-surveys__tab"
        [class.active-surveys__tab--selected]="tab() === 'active'"
        [attr.aria-pressed]="tab() === 'active'"
        (click)="selectTab('active')"
      >
        Active survey
      </button>
      <button
        type="button"
        class="active-surveys__tab"
        [class.active-surveys__tab--selected]="tab() === 'past'"
        [attr.aria-pressed]="tab() === 'past'"
        (click)="selectTab('past')"
      >
        Past survey
      </button>
    </div>

    <app-category-filter [selected]="category()" (selectedChange)="selectCategory($event)" />
  </div>

  @if (loading() && noData()) {
    <p class="active-surveys__status">Loading surveys…</p>
  } @else if (error() && noData()) {
    <p class="active-surveys__status">Couldn't load surveys. {{ error() }}</p>
  }
  <div class="active-surveys__surveys">
    @for (survey of surveys(); track survey.id) {
      <app-active-survey [survey]="survey"></app-active-survey>
    } @empty {
      <p class="active-surveys__empty">No surveys to show.</p>
    }
  </div>
</section>
