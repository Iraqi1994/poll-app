<div class="survey" [routerLink]="['/survey', survey().id]">
  <div class="survey__header">
    <p class="survey__category">Category</p>
    <span class="survey__title">{{ survey().name ?? 'Untitled Survey' }}</span>
  </div>
  <span class="survey__ends">
    @if (survey().end_date) {
      Ends {{ survey().end_date | date: 'mediumDate' }}
    } @else {
      No end date
    }
  </span>
</div>
