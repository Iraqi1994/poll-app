<header class="form-header">
  <img src="/logo-dark.svg" alt="Logo" class="form-header__logo" />
</header>
<section>
  <div class="survey-header">
    <p class="draft">Draft</p>
    <a routerLink="/" class="cancel-btn">
      <span class="cancel-text">Cancel</span>
      <img src="/close.svg" alt="Close" />
    </a>
  </div>
  <h1>Create new survey</h1>
  <form id="survey-form" [formGroup]="surveyForm" (ngSubmit)="onPublish()">
    <div class="survey-meta">
      <div class="survey-meta__left">
        <label for="name">Survey name</label>
        <div class="field-row">
          <input type="text" id="name" formControlName="name" />
          <app-delete-button label="Clear survey name" (pressed)="clearField('name')" />
        </div>

        <div class="meta-row">
          <div class="meta-row__col">
            <label for="endDate">Set end date (optional)</label>
            <div class="field-row">
              <input type="date" id="endDate" formControlName="endDate" />
              <app-delete-button label="Clear end date" (pressed)="clearField('endDate')" />
            </div>
          </div>
          <div class="meta-row__col meta-row__col--category">
            <app-category-select [categoryControl]="surveyForm.controls.category" />
          </div>
        </div>
      </div>
      <div class="survey-meta__right">
        <label for="description">Describing text (optional)</label>
        <div class="field-row field-row--textarea">
          <textarea id="description" formControlName="description"></textarea>
          <app-delete-button label="Clear description" (pressed)="clearField('description')" />
        </div>
      </div>
    </div>

    <div class="survey-questions">
      @for (question of questionGroups; track $index) {
        <app-question
          [questionGroup]="question"
          [questionIndex]="$index + 1"
          (remove)="removeQuestion($index)"
        />
      }

      <button type="button" class="add-question-btn" (click)="addQuestion()">
        <span>Add next question</span>
        <img src="/new-survey-add-circle.svg" alt="add circle" />
      </button>
    </div>
  </form>
  <div class="form-footer">
    <button type="submit" form="survey-form" class="publish-btn">Publish</button>
  </div>
</section>
